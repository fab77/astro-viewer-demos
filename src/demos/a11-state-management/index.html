<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AstroViewer A11 — Save / Restore State</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#001032;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}header{height:52px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(0,10,32,.96);border-bottom:1px solid rgba(255,255,255,.15)}.title{font-size:16px;font-weight:600}.header-right{display:flex;align-items:center;gap:16px}#summary{font-size:13px;opacity:.85}button{padding:6px 12px;border:1px solid rgba(255,255,255,.3);border-radius:5px;background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:13px;cursor:pointer}button:disabled{opacity:.4;cursor:default}
main{position:relative;flex:1;min-height:0}#astrocanvas{display:block;width:100%;height:100%}#demo-label{position:absolute;left:24px;bottom:24px;z-index:10;min-width:320px;max-width:min(590px,calc(100vw - 80px));padding:14px 18px;background:rgba(0,10,32,.84);border:1px solid rgba(255,255,255,.18);border-radius:8px;backdrop-filter:blur(6px);pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}#demo-label.visible{opacity:1;transform:translateY(0)}.headline{font-size:17px;font-weight:600;margin-bottom:4px}.detail{font-size:13px;line-height:1.4;opacity:.82}.api-command{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.14);font:12px/1.5 "SFMono-Regular",Consolas,monospace;color:rgba(170,215,255,.95);white-space:pre-wrap}
#report{position:absolute;right:20px;top:20px;z-index:11;max-width:320px;max-height:40vh;overflow:auto;padding:10px 14px;background:rgba(0,10,32,.82);border:1px solid rgba(255,255,255,.14);border-radius:8px;font-size:12px}#report summary{cursor:pointer;font-weight:600}#results{padding-left:20px}#results li{margin:5px 0}.pass{color:#78e0a1}.fail{color:#ff8c8c}.info{color:#a4c4f8}
</style></head><body><header><div class="title">A11 — Save / Restore State</div><div class="header-right"><span id="summary">Ready</span><button id="run">Run scenario</button></div></header><main><canvas id="astrocanvas"></canvas><div id="demo-label"><div class="headline"></div><div class="detail"></div><div class="api-command"></div></div><details id="report"><summary>Integration assertions</summary><ol id="results"></ol></details></main><script type="module" src="./main.ts"></script></body></html>
