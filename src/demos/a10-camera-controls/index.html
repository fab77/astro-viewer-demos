<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroViewer A10 — Camera Controls</title>
    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #001032;
            color: #fff;
            font: 14px system-ui, sans-serif
        }

        header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #000a20;
            border-bottom: 1px solid #ffffff25
        }

        main {
            position: relative;
            height: calc(100% - 52px)
        }

        #astrocanvas {
            display: block;
            width: 100%;
            height: 100%
        }

        #grid-labels,
        #coords-grid-labels {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #grid-labels {
            z-index: 2;
        }

        #panel label:has(input[type="radio"]:checked),
        #panel label:has(input[type="checkbox"]:checked),
        #panel label[data-active="true"] {
            background: rgba(0, 212, 255, 0.16);
            border-color: #00d4ff;
            color: #ffffff;
            box-shadow: inset 3px 0 #00d4ff;
            border-radius: 5px;
            padding: 5px 8px;
        }

        #panel input:disabled {
            opacity: 1;
            accent-color: #00d4ff;
        }

        #panel label:has(input:disabled) {
            cursor: default;
        }

        #coords-grid-labels {
            width: 100%;
            height: 100%;
        }

        #panel {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 280px;
            background: #061633eb;
            padding: 18px;
            border: 1px solid #ffffff30;
            border-radius: 12px
        }

        h2 {
            margin: 0 0 14px;
            font-size: 17px
        }

        fieldset {
            border: 0;
            padding: 0;
            margin: 0 0 15px
        }

        legend {
            font-weight: 600;
            margin-bottom: 8px
        }

        label {
            display: block;
            margin: 8px 0
        }

        button {
            background: #17365d;
            color: white;
            border: 1px solid #ffffff45;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer
        }

        button:hover {
            background: #285185
        }

        button:disabled {
            opacity: .45
        }

        #actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        #demo-label {
            position: absolute;
            bottom: 35px;
            left: 30px;
            max-width: 550px;
            background: #00142bdc;
            padding: 16px;
            border-left: 3px solid #5bb8ff
        }

        #demo-label strong {
            display: block;
            font-size: 21px;
            margin-bottom: 7px
        }

        #demo-label code {
            color: #8cddff
        }

        input[type=range] {
            width: 100%
        }

        #panel input:disabled {
            opacity: 1;
            accent-color: #00d4ff
        }

        #panel button:disabled {
            opacity: .65
        }

        #panel[hidden] {
            display: none
        }
    </style>
</head>

<body>
    <header><strong>A10 — Camera Controls & Navigation Constraints</strong><span id="status">Initializing</span>
    </header>
    <main><canvas id="astrocanvas"></canvas>
        <div id="grid-labels" aria-hidden="true">
            <div id="coords-grid-labels"></div>
        </div>
        <section id="panel" aria-label="Camera settings">
            <h2>Camera settings</h2>
            <fieldset>
                <legend>Rotation</legend><label><input type="radio" name="rotation" value="free" checked> Free
                    rotation</label><label><input type="radio" name="rotation" value="east-west"> Lock
                    East–West</label><label><input type="radio" name="rotation" value="north-south"> Lock
                    North–South</label>
            </fieldset><label><input id="north-up" type="checkbox"> Keep camera North up</label><label id="sensitivity-setting">Rotation
                sensitivity <output id="sensitivity-value">1</output><input id="sensitivity" type="range" min="0.2"
                    max="2" step="0.1" value="1"></label>
            <div id="actions"><button id="reset-button">Reset view</button><button id="run-button">Run sequence</button>
            </div>
            <p>Drag on the sky to test the constraints.</p>
        </section>
        <div id="demo-label"><strong id="headline">Camera Controls</strong>
            <div id="detail">Explore rotation constraints and view reset.</div><code id="api-command"></code>
        </div>
    </main>
    <script type="module" src="./main.ts"></script>
</body>

</html>
