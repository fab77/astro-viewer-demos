<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AstroViewer A06 — Interaction Colours</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #001032;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            height: 52px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(0, 10, 32, 0.96);
            color: white;
            border-bottom:
                1px solid rgba(255, 255, 255, 0.15);
        }

        .title {
            font-size: 16px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .status {
            font-size: 13px;
            opacity: 0.8;
        }

        .demo-controls {
            display: flex;
            gap: 8px;
        }

        .demo-controls[hidden] {
            display: none;
        }

        .demo-controls button {
            padding: 6px 12px;
            border:
                1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            background:
                rgba(255, 255, 255, 0.08);
            color: white;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .demo-controls button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        main {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        #viewer-container {
            position: absolute;
            inset: 0;
        }

        #astrocanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #demo-cursor {
            position: absolute;
            z-index: 12;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 0 0 2px rgba(0, 10, 32, 0.7);
            pointer-events: none;
        }

        #demo-label {
            position: absolute;
            left: 24px;
            bottom: 24px;
            z-index: 10;
            min-width: 330px;
            max-width: 590px;
            padding: 14px 18px;
            color: white;
            background:
                rgba(0, 10, 32, 0.84);
            border:
                1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            backdrop-filter: blur(6px);
            opacity: 0;
            transform: translateY(8px);
            transition:
                opacity 250ms ease,
                transform 250ms ease;
            pointer-events: none;
        }

        #demo-label.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #demo-label .headline {
            margin-bottom: 4px;
            font-size: 17px;
            font-weight: 600;
        }

        #demo-label .detail {
            font-size: 13px;
            line-height: 1.4;
            opacity: 0.82;
        }

        #demo-label .api-command {
            margin-top: 10px;
            padding-top: 8px;
            border-top:
                1px solid rgba(255, 255, 255, 0.14);
            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;
            font-size: 12px;
            line-height: 1.4;
            color:
                rgba(170, 215, 255, 0.95);
            white-space: pre-wrap;
        }

        #interaction-state {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
            width: 250px;
            padding: 15px 17px;
            color: white;
            background:
                rgba(0, 10, 32, 0.82);
            border:
                1px solid rgba(255, 255, 255, 0.17);
            border-radius: 8px;
            backdrop-filter: blur(6px);
            opacity: 0;
            transition: opacity 250ms ease;
            pointer-events: none;
        }

        #interaction-state.visible {
            opacity: 1;
        }

        .interaction-title {
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .interaction-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
            opacity: 0.45;
            transition: opacity 200ms ease;
        }

        .interaction-row.active {
            opacity: 1;
        }

        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .swatch.normal {
            background: #ff9f1c;
        }

        .swatch.interaction {
            background: #8c570f;
        }

        #demo-title {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            background:
                rgba(0, 10, 32, 0.78);
            backdrop-filter: blur(3px);
            opacity: 0;
            visibility: hidden;
            transition:
                opacity 500ms ease,
                visibility 500ms ease;
            pointer-events: none;
        }

        #demo-title.visible {
            opacity: 1;
            visibility: visible;
        }

        .demo-title-product {
            margin-bottom: 14px;
            font-size: 15px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .demo-title-name {
            font-size: 34px;
            font-weight: 600;
        }

        .demo-title-description {
            margin-top: 12px;
            font-size: 16px;
            opacity: 0.78;
        }

        .demo-title-id {
            margin-top: 22px;
            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;
            font-size: 13px;
            opacity: 0.55;
        }
    </style>
</head>

<body>
    <header>
        <div class="title">
            AstroViewer — A06 Interaction Colours
        </div>

        <div class="header-right">
            <div id="demo-controls" class="demo-controls">
                <button id="run-button">Run</button>
                <button id="pause-button" disabled>
                    Pause
                </button>
                <button id="reset-button">
                    Reset
                </button>
            </div>

            <div id="status" class="status">
                Initialising…
            </div>
        </div>
    </header>

    <main>
        <div id="viewer-container">
            <canvas id="astrocanvas"></canvas>

            <div id="demo-cursor" hidden></div>

            <div id="interaction-state">
                <div class="interaction-title">
                    Interaction state
                </div>

                <div id="state-normal" class="interaction-row">
                    <span class="swatch normal"></span>
                    Normal
                </div>

                <div id="state-hover" class="interaction-row">
                    <span class="swatch interaction"></span>
                    Hover
                </div>

                <div id="state-selected" class="interaction-row">
                    <span class="swatch interaction"></span>
                    Selected emphasis
                </div>
            </div>

            <div id="demo-label">
                <div class="headline"></div>
                <div class="detail"></div>
                <div class="api-command"></div>
            </div>
        </div>

        <div id="demo-title">
            <div class="demo-title-product">
                AstroViewer Demo
            </div>

            <div class="demo-title-name">
                Interaction Colours
            </div>

            <div class="demo-title-description">
                Consistent visual feedback for hover and selection
            </div>

            <div class="demo-title-id">
                A06
            </div>
        </div>
    </main>

    <script type="module" src="./main.ts"></script>
</body>

</html>
