<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AstroViewer A00 — Astronomy Showcase</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020c20;color:#eef7ff;font:14px system-ui,sans-serif}header{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;background:#06152b;border-bottom:1px solid #ffffff25}main{height:calc(100% - 54px);position:relative}#astrocanvas{width:100%;height:100%;display:block}#grid-labels,#coords-grid-labels{position:absolute;inset:0;pointer-events:none}#grid-labels{z-index:2}#title{position:absolute;top:10%;left:7%;font-size:clamp(30px,5vw,72px);font-weight:750;letter-spacing:.02em;text-shadow:0 3px 18px #000;opacity:0;transition:opacity .6s;pointer-events:none}#title.visible{opacity:1}#caption{position:absolute;left:28px;bottom:28px;max-width:min(570px,65vw);background:#06152be8;border-left:3px solid #61b9ff;padding:17px 21px;z-index:4}#headline{font-size:24px;font-weight:700;margin-bottom:8px}#detail{line-height:1.5}#api-command{display:block;color:#92d8ff;margin-top:10px;font-size:12px;white-space:pre-wrap}#controls{position:absolute;right:20px;top:20px;background:#06152be8;border:1px solid #ffffff35;border-radius:10px;padding:14px;z-index:4}button{background:#20456f;color:white;border:1px solid #ffffff45;border-radius:6px;padding:9px 14px;margin:2px;cursor:pointer}button:disabled{opacity:.45}#scene{color:#a9c8e5;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}#controls[hidden]{display:none}
</style></head><body><header><strong>A00 — Astronomy Showcase</strong><span id="status">Initializing</span></header><main><canvas id="astrocanvas"></canvas><div id="grid-labels"><div id="coords-grid-labels"></div></div><div id="title">Explore the Universe</div><section id="controls"><button id="run-button">Run showcase</button><button id="pause-button" disabled>Pause</button><button id="reset-button">Reset</button></section><section id="caption"><div id="scene">Opening</div><div id="headline">AstroViewer</div><div id="detail">Explore the sky across wavelengths.</div><code id="api-command"></code></section></main><script type="module" src="./main.ts"></script></body></html>
