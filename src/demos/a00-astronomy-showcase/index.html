<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AstroViewer A00 — Astronomy Showcase</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020c20;
        color: #eef7ff;
        font:
          14px system-ui,
          sans-serif;
      }
      header {
        display: none;
      }
      main {
        height: 100%;
        position: relative;
      }
      #astrocanvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #grid-labels,
      #coords-grid-labels,
      #healpix-grid-labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #grid-labels {
        z-index: 2;
      }
      #title {
        position: absolute;
        top: 10%;
        left: 7%;
        font-size: clamp(30px, 5vw, 72px);
        font-weight: 750;
        letter-spacing: 0.02em;
        text-shadow: 0 3px 18px #000;
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #title.visible {
        opacity: 1;
      }
      #caption {
        position: absolute;
        left: 28px;
        bottom: 25px;
        max-width: min(570px, 65vw);
        background: #06152be8;
        border-left: 1px solid #61b9ff;
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
        padding: 17px 21px;
        z-index: 4;
      }
      #fits-mode-badge {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        padding: 7px 12px;
        border: 1px solid #d5a83d;
        border-radius: 6px;
        background: #fff0ad;
        color: #493509;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.04em;
        pointer-events: none;
      }
      #fits-mode-badge[hidden] { display: none; }
      #headline {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      #detail {
        line-height: 1.5;
      }
      #api-command {
        display: block;
        color: #92d8ff;
        margin-top: 10px;
        font-size: 12px;
        white-space: pre-wrap;
      }
      #controls {
        position: absolute;
        right: 20px;
        top: 20px;
        background: #06152be8;
        border: 1px solid #ffffff35;
        border-radius: 10px;
        padding: 14px;
        z-index: 4;
      }
      button {
        background: #20456f;
        color: white;
        border: 1px solid #ffffff45;
        border-radius: 6px;
        padding: 9px 14px;
        margin: 2px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
      }
      #scene {
        color: #a9c8e5;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      #controls[hidden] {
        display: none;
      }
      #interaction-legend {
        position: absolute;
        right: 23px;
        bottom: 180px;
        z-index: 5;
        background: #06152bef;
        border: 1px solid #ffffff40;
        border-radius: 10px;
        padding: 15px 18px;
        min-width: 205px;
        pointer-events: none;
      }
      #interaction-legend[hidden],
      #demo-pointer[hidden] {
        display: none !important;
      }
      .legend-title {
        font-weight: 700;
        margin-bottom: 11px;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 5px 7px;
        border-radius: 6px;
        opacity: 0.65;
      }
      .legend-row.active {
        opacity: 1;
        background: #ffffff1b;
      }
      .swatch {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 1px solid #ffffff66;
        background: var(--base);
      }
      .legend-row[data-state="hover"] .swatch {
        background: var(--hover);
      }
      .legend-row[data-state="selected"] .swatch {
        background: var(--selected);
      }
      #interaction-legend[data-kind="footprint"] .swatch {
        border-radius: 2px;
        background: transparent !important;
        border: 3px solid var(--base);
      }
      #interaction-legend[data-kind="footprint"] [data-state="hover"] .swatch {
        border-color: var(--hover);
      }
      #interaction-legend[data-kind="footprint"]
        [data-state="selected"]
        .swatch {
        border-color: var(--selected);
        background: color-mix(
          in srgb,
          var(--selected) 25%,
          transparent
        ) !important;
      }
      #interaction-legend[data-kind="catalogue"]
        [data-state="selected"]
        .swatch {
        position: relative;
      }
      #interaction-legend[data-kind="catalogue"]
        [data-state="selected"]
        .swatch::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #fff;
        transform: translate(-50%, -50%);
      }
      #demo-pointer {
        position: fixed;
        display: block;
        z-index: 2147483647;
        pointer-events: none;
        width: 23px;
        height: 28px;
        overflow: visible;
        filter: drop-shadow(1px 2px 2px #000);
        transform: translate(-3px, -2px);
      }
      #demo-pointer svg {
        display: block;
        width: 23px;
        height: 28px;
        overflow: visible;
      }
      #science-credits {
        position: absolute;
        left: 28px;
        top: 18px;
        max-width: 65%;
        font-size: 12px;
        color: #bed1e2;
        z-index: 5;
        text-shadow: 0 1px 4px #000;
        background: transparent;
        padding: 6px 0;
        line-height: 1.45;
        max-width: 54%;
        font-size: 12px;
        text-shadow:
          1px 1px 1px #000,
          -1px -1px 1px #000,
          1px -1px 1px #000,
          -1px 1px 1px #000,
          0 0 5px #000;
        pointer-events: auto;
      }
      #metadata-box,
      #coordinate-hud {
        position: absolute;
        right: 22px;
        top: 100px;
        width: 290px;
        background: #06152bea;
        border: 1px solid #ffffff40;
        border-radius: 8px;
        padding: 16px;
        z-index: 5;
        font: 12px/1.65 system-ui;
        white-space: pre-line;
        overflow-wrap: anywhere;
        pointer-events: none;
      }
      #coordinate-hud {
        top: auto;
        bottom: 22px;
        z-index: 13;
      }
      #science-credits strong {
        display: block;
        font-size: 10px;
        letter-spacing: 0.12em;
        color: #fff;
      }
      #science-credits a {
        color: #9cd6fa;
        text-decoration: none;
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      #science-credits > a {
        display: block;
      }
      #science-credits a:hover {
        text-decoration: underline;
      }
      #data-example {
        position: absolute;
        top: 150px;
        left: 28px;
        width: min(570px, 48vw);
        max-height: 34vh;
        overflow: auto;
        z-index: 6;
        padding: 12px 16px;
        border: 1px solid #61b9ff80;
        border-radius: 8px;
        background: #06152bf2;
      }
      #data-example[hidden] {
        display: none;
      }
      #data-example strong {
        color: #92d8ff;
        font-size: 12px;
      }
      #data-example pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 11px/1.45 monospace;
        margin: 8px 0 0;
      }
      #metadata-box [data-hover] {
        border-left: 2px solid #ffda78;
        padding-left: 8px;
      }
      #metadata-box {
        width: 340px;
        max-height: calc(100% - 300px);
        overflow: auto;
        pointer-events: auto;
      }
      #metadata-box .selected-record {
        border-bottom: 1px solid #ffffff30;
        padding: 8px 0;
        font-size: 11px;
        line-height: 1.5;
      }
      #metadata-box .selected-record span {
        display: inline-block;
        margin-right: 10px;
      }
      #metadata-box .selected-record strong {
        margin-bottom: 3px;
      }
      #metadata-box strong {
        display: block;
        color: #92d8ff;
        margin-bottom: 9px;
      }
      #caption {
        max-width: min(590px, 55vw);
      }
      #api-command {
        overflow-wrap: anywhere;
        max-height: 150px;
        overflow: auto;
      }
      @media (max-width: 800px) {
        #headline {
          font-size: 18px;
        }
        #caption {
          left: 12px;
          bottom: 12px;
          padding: 12px;
          max-width: 55vw;
        }
        #metadata-box,
        #coordinate-hud {
          right: 12px;
          width: 220px;
        }
        #coordinate-hud {
          bottom: 12px;
        }
        #interaction-legend {
          left: 12px;
          top: 90px;
          min-width: 180px;
        }
        #science-credits {
          left: 12px;
          max-width: 60%;
        }
      }
      #state-stack {
        position: absolute;
        right: 22px;
        top: 22px;
        width: 300px;
        z-index: 8;
        background: #06152be8;
        border: 1px solid #ffffff35;
        border-radius: 10px;
        padding: 14px;
      }
      #state-stack[hidden] {
        display: none;
      }
      #state-stack > strong {
        font-size: 15px;
      }
      #state-stack > p {
        font-size: 11px;
        line-height: 1.5;
        color: #bad3e5;
        margin: 8px 0 12px;
      }
      .state-card {
        display: flex;
        align-items: stretch;
        border: 1px solid #ffffff25;
        border-radius: 7px;
        margin-top: 9px;
        overflow: hidden;
      }
      .state-card[data-active="true"] {
        border-color: #61b9ff;
        box-shadow: 0 0 0 1px #61b9ff55;
      }
      .state-restore {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        flex: 1;
        min-width: 0;
        margin: 0;
        padding: 9px;
        border: 0;
        border-radius: 0;
        background: transparent;
      }
      .state-restore img {
        width: 70px;
        height: 54px;
        object-fit: cover;
        border-radius: 3px;
      }
      .state-restore b,
      .state-restore small {
        display: block;
      }
      .state-restore small {
        font-size: 10px;
        line-height: 1.5;
        color: #bad3e5;
        margin-top: 4px;
      }
      .state-delete {
        margin: 0;
        padding: 5px 8px;
        border: 0;
        border-left: 1px solid #ffffff20;
        border-radius: 0;
        background: transparent;
        font-size: 19px;
      }
      .state-restore:hover,
      .state-delete:hover,
      .demo-click {
        background: #285580 !important;
      }
      #state-stack button:disabled {
        opacity: 0.75;
        cursor: default;
      }
      body:has(#state-stack:not([hidden])) #controls {
        top: auto;
        bottom: 20px;
      }
      #api-command {
        max-height: 190px;
      }
      #sw-version{
        position: absolute;
        bottom: 2px;
        right: 23px;
        font-size: 12px;
      }
      #scene-intro {
        position: absolute;
        inset: 0;
        z-index: 12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        background: #020c2088;
        opacity: 1;
        transition: opacity 350ms;
        pointer-events: none;
      }
      #scene-intro[hidden],
      #ecosystem-diagram[hidden],
      #caption[hidden] {
        display: none;
      }
      #scene-intro.leaving {
        opacity: 0;
      }
      #scene-intro.opening {
        background: transparent;
      }
      #scene-intro p {
        margin: 0;
        font-size: clamp(18px, 2vw, 28px);
        color: #c5e7ff;
        text-shadow: 0 2px 15px #000;
      }
      #scene-intro small {
        font-size: 14px;
        letter-spacing: 0.3em;
        color: #9cd6fa;
      }
      #scene-intro h1 {
        font-size: clamp(28px, 4vw, 56px);
        max-width: 1000px;
        margin: 16px 0;
        text-shadow: 0 2px 15px #000;
      }
      #ecosystem-diagram {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(940px, 90%);
        height: 400px;
        z-index: 6;
        padding: 24px;
        background: #06152bf5;
        border: 1px solid #61b9ff70;
        border-radius: 14px;
        text-align: center;
      }
      #ecosystem-diagram h2 {
        font-size: 25px;
        margin: 0 0 10px;
      }
      .diagram-subtitle,
      .diagram-note {
        color: #bad3e5;
        font-size: 13px;
      }
      .dependency-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .diagram-node {
        padding: 13px 20px;
        background: #102a45;
        border: 1px solid #61b9ff70;
        border-radius: 8px;
      }
      .diagram-node b,
      .diagram-node span {
        display: block;
      }
      .diagram-node span {
        margin-top: 5px;
        font-size: 12px;
        color: #bad3e5;
      }
      .diagram-arrow {
        color: #71c6ff;
        font-size: 19px;
        margin: 7px;
      }
      .diagram-note {
        margin-bottom: 0;
      }
      /* One persistent Viewer subtree: centered first, then left in the ecosystem. */
      .ecosystem-stage { position: relative; min-height: 285px; }
      .ecosystem-demo {
        position: absolute; top: 0; left: 50%; width: 38%;
        transform: translate(-50%, -12px); opacity: 0;
        transition: opacity .65s ease .25s, transform 1s ease .15s;
      }
      .ecosystem-branches {
        position: absolute; top: 64px; left: 24%; width: 52%; height: 30px;
        border-top: 1px solid #71c6ff; opacity: 0;
        transition: opacity .7s ease .45s;
      }
      .ecosystem-branches span {
        position: absolute; top: 0; height: 25px;
        border-left: 1px solid #71c6ff;
      }
      .ecosystem-branches span:first-child { left: 0; }
      .ecosystem-branches span:last-child { right: 0; }
      .ecosystem-pair { position: relative; min-height: 270px; }
      .ecosystem-viewer {
        box-sizing: border-box; width: 100%; position: absolute;
        left: 0; top: 0; padding: 8px 12px;
        border: 2px solid #17b5a7; border-radius: 12px;
        transition: width 1.15s ease, top 1.15s ease, left 1.15s ease;
      }
      .ecosystem-services {
        position: absolute; top: 96px; left: 54%; width: 46%;
        box-sizing: border-box; opacity: 0;
        transform: translateX(18px);
        transition: opacity .7s ease .4s, transform .9s ease .3s;
      }
      .ecosystem-services .diagram-node { padding: 12px; }
      .ecosystem-external { border-style: dashed; }
      .ecosystem-expanded .ecosystem-demo { opacity: 1; transform: translate(-50%, 0); }
      .ecosystem-expanded .ecosystem-branches { opacity: 1; }
      .ecosystem-expanded .ecosystem-viewer { width: 51%; top: 96px; }
      .ecosystem-expanded .ecosystem-services { opacity: 1; transform: translateX(0); }
      #ecosystem-diagram { transition: top 1.1s ease; }
      #ecosystem-diagram.ecosystem-expanded { top: 47%; }
      @media (max-width: 700px) {
        .ecosystem-demo { width: 55%; }
        .ecosystem-branches { left: 24%; width: 52%; }
        .ecosystem-viewer { padding: 6px; }
        .ecosystem-services .diagram-node { padding: 6px; }
        .ecosystem-services .diagram-node span { font-size: 10px; }
      }
      .service-flow {
        max-width: 640px;
        margin: auto;
      }
      .service-flow .diagram-node {
        padding: 8px 16px;
      }
      .service-flow .diagram-arrow {
        font-size: 15px;
        margin: 2px;
      }
      .diagram-application {
        background: #164f67;
      }
      @media (max-width: 700px) {
        .dependency-grid {
          gap: 6px;
        }
        .diagram-node {
          padding: 10px 6px;
        }
        #ecosystem-diagram {
          top: 40%;
          padding: 14px;
        }
        .diagram-node b {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>A00 — Astronomy Showcase</strong
      ><span id="status">Initializing</span>
    </header>
    <main>
      <canvas id="astrocanvas"></canvas>
      <div id="sw-version">astro-viewer v%ASTRO_VIEWER_VERSION%</div>
      <div id="scene-intro" hidden>
        <small></small>
        <h1></h1>
        <p hidden></p>
      </div>
      <section
        id="ecosystem-diagram"
        hidden
        aria-label="Scientific software architecture"
      ></section>
      <div id="grid-labels">
        <div id="coords-grid-labels"></div>
        <div id="healpix-grid-labels"></div>
      </div>
      <div id="title">Explore the Universe</div>
      <section id="controls">
        <button id="run-button">Run showcase</button
        ><button id="pause-button" disabled>Pause</button
        ><button id="reset-button">Reset</button>
      </section>
      <aside
        id="interaction-legend"
        hidden
        style="--base: #00d4ff; --hover: #00758c; --selected: #003540"
      >
        <div class="legend-title">Interaction</div>
        <div class="legend-row" data-state="normal">
          <span class="swatch"></span>Normal
        </div>
        <div class="legend-row" data-state="hover">
          <span class="swatch"></span>Hover
        </div>
        <div class="legend-row" data-state="selected">
          <span class="swatch"></span>Selected
        </div>
      </aside>
      <div id="demo-pointer" hidden aria-hidden="true">
        <svg viewBox="0 0 28 34" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M3 2V28L10 21L15 32L20 29L15 19H25Z"
            fill="white"
            stroke="#071629"
            stroke-width="2"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div id="fits-mode-badge" hidden>FITS MODE ENABLED</div>
      <section id="caption">
        <div id="scene">Opening</div>
        <div id="headline">AstroViewer</div>
        <div id="detail">Explore the sky across wavelengths.</div>
        <code id="api-command"></code>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
